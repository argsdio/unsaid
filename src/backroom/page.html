<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Unsaid — backroom</title>
<style>
  :root {
    --bg: #0b0d10; --panel: #14181d; --line: #242b33;
    --text: #e8edf2; --dim: #8b97a3; --pass: #4ade80; --fail: #64748b; --accent: #f0b429;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 ui-sans-serif, -apple-system, "Segoe UI", sans-serif;
    padding: 28px 32px;
  }
  header { display: flex; align-items: baseline; gap: 16px; margin-bottom: 24px; }
  h1 { font-size: 26px; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--dim); font-size: 15px; }
  .grid { display: grid; grid-template-columns: 1.35fr 1fr; gap: 24px; align-items: start; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--dim); margin: 0 0 16px; font-weight: 600; }
  .row { display: flex; align-items: center; gap: 14px; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .name { flex: 1; font-size: 19px; }
  .row.out .name { text-decoration: line-through; color: var(--fail); }
  .hood { color: var(--dim); font-size: 14px; }
  .why { font-size: 13px; color: var(--fail); font-style: italic; white-space: nowrap; }
  .cost { color: var(--dim); font-size: 15px; min-width: 44px; text-align: right; }
  .bars { display: flex; gap: 5px; align-items: flex-end; height: 26px; }
  .bar { width: 11px; background: var(--pass); border-radius: 2px 2px 0 0; opacity: 0.85; }
  .worst { font-variant-numeric: tabular-nums; color: var(--pass); min-width: 52px; text-align: right; font-size: 16px; }
  .winner { color: var(--accent); }
  .winner .name { font-weight: 600; }
  button {
    background: transparent; color: var(--accent); border: 1px solid var(--accent);
    border-radius: 8px; padding: 9px 16px; font: inherit; cursor: pointer;
  }
  .reveal { display: grid; gap: 14px; }
  .said { font-size: 15px; }
  .who { color: var(--dim); font-size: 13px; text-transform: uppercase; letter-spacing: 0.07em; }
  .quote { color: var(--text); }
  .saw { border-top: 1px solid var(--line); padding-top: 14px; }
  code { font: 14px/1.6 ui-monospace, "SF Mono", Menlo, monospace; color: var(--accent); }
  .hidden { display: none; }
  .divider { height: 1px; background: var(--line); margin: 14px 0 4px; }
  .summary { color: var(--dim); font-size: 14px; padding-top: 12px; font-style: italic; }
  .turn { font-size: 15px; padding: 6px 0 6px 12px; border-left: 2px solid var(--line); color: var(--dim); }
  .turn.last { color: var(--text); border-left-color: var(--accent); }
  #transcript { margin-bottom: 18px; }
</style>
</head>
<body>
<header>
  <h1>Unsaid — backroom</h1>
  <span class="sub" id="status">connecting…</span>
</header>

<div class="grid">
  <section class="panel">
    <h2>Negotiation</h2>
    <div id="transcript"></div>
    <div id="candidates"></div>
  </section>

  <section class="panel">
    <h2>Privacy reveal</h2>
    <button id="toggle">Show what each person said</button>
    <div id="reveal" class="reveal hidden"></div>
  </section>
</div>

<script>
  const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

  // Group-level categories only. Never a person, never a reason.
  const WHY = {
    budget: "over the group budget",
    dietary: "missing a required tag",
    travel: "too far for someone",
  };

  let revealed = false;
  document.getElementById("toggle").addEventListener("click", () => {
    revealed = !revealed;
    document.getElementById("reveal").classList.toggle("hidden", !revealed);
    document.getElementById("toggle").textContent = revealed
      ? "Hide"
      : "Show what each person said";
  });

  // A's round carries every rejected venue -- 42 of 50 in a typical run. Showing
  // them all is unreadable on a projector, so survivors get full rows, a handful
  // of eliminations get struck out for the visible-crossing-out beat, and the
  // rest collapse into one counted line.
  const CROSSOUTS_SHOWN = 6;
  // The catalogue is Places-sourced now: a loose budget leaves hundreds of
  // survivors, and 300 rows on a projector is a wall of text nobody reads.
  const SURVIVORS_SHOWN = 10;

  // The round-by-round argument. The candidate rows below show only the latest
  // round, so without this the multi-round negotiation is invisible.
  function renderTranscript(rounds) {
    return rounds
      .filter((r) => r.narration)
      .map((r, i, all) => `<div class="turn ${i === all.length - 1 ? "last" : ""}">${esc(r.narration)}</div>`)
      .join("");
  }

  function renderCandidates(rounds) {
    const round = rounds[rounds.length - 1];
    if (!round) return "<div class='sub'>waiting for the first round…</div>";

    const worstOf = (c) => (c.scores.length ? Math.min(...c.scores) : -1);
    const passed = round.candidates
      .filter((c) => c.passed)
      .sort((a, b) => worstOf(b) - worstOf(a));
    const failed = round.candidates.filter((c) => !c.passed);
    const best = passed[0];

    const rows = passed.slice(0, SURVIVORS_SHOWN).map((c) => {
      const bars = c.scores
        .map((s) => `<div class="bar" style="height:${Math.max(3, s * 26)}px"></div>`)
        .join("");
      return `<div class="row ${best && c.venueId === best.venueId ? "winner" : ""}">
        <span class="name">${esc(c.name)}</span>
        <span class="hood">${esc([c.cuisine, c.neighborhood].filter(Boolean).join(" · "))}</span>
        <span class="cost">${c.estCostUSD === null ? "" : "$" + c.estCostUSD}</span>
        <div class="bars">${bars}</div>
        <span class="worst">${worstOf(c).toFixed(2)}</span>
      </div>`;
    });

    const crossouts = failed.slice(0, CROSSOUTS_SHOWN).map((c) => `<div class="row out">
        <span class="name">${esc(c.name)}</span>
        <span class="hood">${esc([c.cuisine, c.neighborhood].filter(Boolean).join(" · "))}</span>
        <span class="cost">${c.estCostUSD === null ? "" : "$" + c.estCostUSD}</span>
        <span class="why">reason private — ${WHY[c.failedOn] || "filtered"}</span>
      </div>`);

    const remaining = failed.length - crossouts.length;
    let summary = "";
    if (remaining > 0) {
      const byCategory = {};
      for (const c of failed) byCategory[c.failedOn] = (byCategory[c.failedOn] || 0) + 1;
      const parts = Object.entries(byCategory)
        .sort((a, b) => b[1] - a[1])
        .map(([key, n]) => `${n} ${WHY[key] || key}`);
      summary = `<div class="summary">+${remaining} more eliminated · ${parts.join(" · ")}</div>`;
    }

    const hiddenPassed = passed.length - rows.length;
    const more = hiddenPassed > 0 ? `<div class="summary">+${hiddenPassed} more that also work</div>` : "";
    return rows.join("") + more + (crossouts.length ? `<div class="divider"></div>` : "") +
      crossouts.join("") + summary;
  }

  function renderReveal(said, merged) {
    const people = Object.entries(said)
      .map(
        ([who, lines]) => `<div class="said">
          <div class="who">${esc(who)} said privately</div>
          <div class="quote">${lines.map((l) => "“" + esc(l) + "”").join(" · ")}</div>
        </div>`,
      )
      .join("");

    const saw = merged
      ? `<code>budget ≤ $${merged.budgetCapUSD}<br />must have: ${
          merged.requiredDietary.length ? merged.requiredDietary.join(", ") : "nothing"
        }<br />window: ${merged.window.start.slice(11, 16)}–${merged.window.end.slice(11, 16)}</code>`
      : "<code>not computed yet</code>";

    return `${people}<div class="saw"><div class="who">All the orchestrator ever saw</div>${saw}</div>`;
  }

  async function tick() {
    try {
      const res = await fetch("/api/state" + location.search);
      const state = await res.json();
      document.getElementById("transcript").innerHTML = renderTranscript(state.rounds);
      document.getElementById("candidates").innerHTML = renderCandidates(state.rounds);
      document.getElementById("reveal").innerHTML = renderReveal(state.said, state.merged);
      document.getElementById("status").textContent =
        `round ${state.rounds.length || 0} · live`;
    } catch (err) {
      document.getElementById("status").textContent = "disconnected";
    }
  }

  tick();
  setInterval(tick, 1500);
</script>
</body>
</html>
